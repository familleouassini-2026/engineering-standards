name: Documentation Checks

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown formatting basics
        run: |
          python - <<'PY'
          from pathlib import Path
          failures=[]
          for p in Path('.').rglob('*.md'):
              text=p.read_text(encoding='utf-8')
              if '\t' in text:
                  failures.append(f"{p}: contains tab characters")
              if not text.endswith('\n'):
                  failures.append(f"{p}: missing final newline")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
